[package]
name = "dsh-launcher"
version = "0.4.0"
description = "deepseek-harness 启动器与运行环境管理器"
authors = ["dsh-launcher"]
edition = "2021"

# 详见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀可避免与 bin 名冲突（Windows 下已知问题，见 https://github.com/rust-lang/cargo/issues/8519）
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
# Windows 原生 API：设置任务栏大图标（ICON_BIG，RGBA→CreateIcon，修复内嵌窗口任务栏图标模糊）+ 注册表/环境变量/代码页
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Environment", "Win32_Globalization"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
# 窗口图标回归测试（tests/icon_window_test.rs）需 CreateIcon/GetIconInfo（GDI）
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Environment", "Win32_Globalization"] }
