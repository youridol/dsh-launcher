[package]
name = "dsh-launcher"
version = "0.1.8"
description = "deepseek-harness 启动器与运行环境管理器"
authors = ["dsh-launcher"]
edition = "2021"

# 详见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀可避免与 bin 名冲突（Windows 下已知问题，见 https://github.com/rust-lang/cargo/issues/8519）
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
