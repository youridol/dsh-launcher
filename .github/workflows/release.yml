# 自动发布工作流：master 每次提交自动构建当前版本并发布；若已发布则迭代 PATCH 版本后构建
# 语义（保证"每次提交都发布一个新版本"）：
#   1. 读取当前版本（package.json）
#   2. 若 v<当前版本> tag 已存在（已发布过）且本次有新提交 → bump patch → 构建新版本
#   3. 若 v<当前版本> tag 不存在（如清理后首次推送）→ 直接构建当前版本
#   4. 构建产物由 tauri-action 上传到 GitHub Release
# 手动触发（workflow_dispatch）：
#   version-bump: minor/major → 强制按指定类型递增后再构建
#   skip-release: true        → 只跳过发布；不再自动递增（避免无 Release 的版本跳跃，见 T7）
# v0.4.13（审计修复 T5/T6）：bump 提交推送后显式打 tag（指向含对应 CHANGELOG 的提交），
# 并在决策前同步到最新远端 master（防排队 run 基于旧 SHA 重复发布）。

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version-bump:
        description: 版本递增类型（忽略则按需：当前版本已发布才递增）
        type: choice
        default: none
        options: [none, patch, minor, major]
      skip-release:
        description: 只递增版本并提交，跳过构建发布
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出代码（完整历史，用于版本 tag 判断）
        # pin 到不可变 commit SHA（ADR-0009 D17）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js（22）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        # pin SHA 后必须显式传 toolchain（本 action 由 @rev 推断，官方 README）
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --include=dev

      - name: 校验（版本一致性 + tsc + vite build + cargo check）
        run: |
          node scripts/check-version-sync.mjs
          npx tsc --noEmit
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      # 审计修复 T6：排队/延迟触发的 run 可能检出了旧 SHA，
      # 先同步到最新远端 master（含 tags），避免基于过期状态重复 bump/冲突。
      - name: 同步到最新远端 master（防排队竞态）
        shell: bash
        run: |
          git fetch origin master --tags
          git reset --hard origin/master
          # reset 后版本可能与本地构建所用版本不同 → 复检一致性（ADR-0009 D1）
          node scripts/check-version-sync.mjs

      # 决策：当前版本是否已发布（tag 存在）
      - name: 判断当前版本是否已发布
        id: published
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          if (git tag -l "v$version") {
            echo "is-published=true" | Out-File -Append $env:GITHUB_OUTPUT
            echo "当前版本 v$version 已发布"
          } else {
            echo "is-published=false" | Out-File -Append $env:GITHUB_OUTPUT
            echo "当前版本 v$version 未发布"
          }

      # 需要递增版本的条件：手动指定（none 除外）或 已发布（自动迭代）
      - name: 递增版本号
        id: bump
        run: |
          $manual = "${{ inputs.version-bump }}"
          $isPublished = "${{ steps.published.outputs.is-published }}"
          $skipRelease = "${{ inputs.skip-release }}"
          if ($manual -ne "" -and $manual -ne "none") {
            node scripts/bump-version.mjs --$manual
          } elseif ($skipRelease -eq "true") {
            Write-Host "skip-release=true：跳过自动版本递增（避免无 Release 的版本跳跃，T7）"
          } elseif ($isPublished -eq "true") {
            node scripts/bump-version.mjs --patch
          } else {
            echo "当前版本未发布，直接使用，不递增"
          }
          $newVersion = (Get-Content package.json | ConvertFrom-Json).version
          echo "new=$newVersion" | Out-File -Append $env:GITHUB_OUTPUT
          echo "发布版本: v$newVersion"

      # CHANGELOG：插入当前提交的完整变更说明（若该版本条目不存在）
      # 说明：
      # - 使用 git log 的完整 body（多行，含各修改点）写入 CHANGELOG 顶部
      # - 用“按行数组”方式插入（兼容 CRLF/LF 行尾，避免正则匹配失败导致条目丢失）
      # - UTF8 无 BOM 写入（PS7 的 utf8 默认无 BOM；显式 utf8NoBOM 保险）
      - name: 更新 CHANGELOG
        run: |
          $newVersion = "${{ steps.bump.outputs.new }}"
          $lines = Get-Content CHANGELOG.md
          $joined = $lines -join "`n"
          # 字面量子串判定（ADR-0009 D3，**已修订口径**）。原写法 -match "\[$newVersion\]"
          # 经实测**能正确命中**已存在条目（`\[`/`\]` 是转义字面括号，`.` 是单字符通配，
          # 恰好也能匹配字面点），故原写法**不是**功能缺陷 —— 审计初稿"字符类永不命中"的
          # 判断有误，已按实测更正。此处改为 Contains 的真实收益是消除歧义：版本号中的 `.`
          # 在正则里退化为通配符，理论上可命中 `[0x9y0]` 这类非目标文本；Contains 为精确
          # 字面匹配。属健壮性改进，非缺陷修复。
          if ($joined.Contains("[$newVersion]")) {
            echo "CHANGELOG 已含 v$newVersion，跳过"
            exit 0
          }
          $date = Get-Date -Format "yyyy-MM-dd"
          # 完整提交说明（title + body，排除 [skip ci] 与空行）
          $rawMsg = git log -1 --pretty=%B
          $msgLines = @($rawMsg -split "`r?`n") | Where-Object { $_.Trim() -ne '' -and $_ -notmatch '^\[skip ci\]' }
          # 新条目行数组（标题行加 - 前缀；已带 - 前缀的详情行不重复加）
          $entryLines = @("## [$newVersion] - $date", "", "### 变更", "")
          foreach ($m in $msgLines) {
            $trimmed = $m.Trim()
            if ($trimmed -match '^- ') { $entryLines += $trimmed } else { $entryLines += "- $trimmed" }
          }
          # 找 "# Changelog" 头位置（兼容 BOM）
          $headerIdx = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^# Changelog') { $headerIdx = $i; break }
          }
          # 新文件 = 头（去 BOM 的干净头）之后插入空行 + 新条目
          $newLines = @()
          for ($i = 0; $i -le $headerIdx; $i++) { $newLines += $lines[$i] -replace "^\uFEFF", '' }
          $newLines += ""
          $newLines += $entryLines
          for ($i = $headerIdx + 1; $i -lt $lines.Count; $i++) { $newLines += $lines[$i] }
          # 统一 CRLF 写入（保持仓库既有行尾风格），UTF8 无 BOM
          ($newLines -join "`r`n") + "`r`n" | Set-Content CHANGELOG.md -Encoding utf8NoBOM -NoNewline
          echo "CHANGELOG 已更新: $($msgLines[0])"

      # 提取本次版本的 CHANGELOG 条目 → 写入临时文件（供 release notes 使用，
      # 避免 YAML 内联多行 output 的转义/缩进问题）
      - name: 提取 Release notes（CHANGELOG 条目）
        id: release-notes
        shell: bash
        run: |
          new_version="${{ steps.bump.outputs.new }}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # 提取 CHANGELOG 中 "## [版本]" 到下一个 "## [" 的条目
          # 用 index() 匹配版本标记（避免正则转义问题）
          marker="[$new_version]"
          awk -v m="$marker" '
            index($0, "## ") == 1 {
              if (found) exit
              if (index($0, m) > 0) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ -s "$notes_file" ]; then
            echo "已提取 v$new_version 的 CHANGELOG 条目"
          else
            echo "未找到 v$new_version 条目，回退到提交信息"
            echo "由 CI 自动发布（commit: ${{ github.sha }}）" > "$notes_file"
          fi
          # 记录文件路径供后续步骤使用（通过 env 传递，不经 YAML 插值）
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: 提交版本/CHANGELOG 变更
        # bash：`git commit ... || echo` 在 pwsh 下不重置 $LASTEXITCODE（native 退出码残留）
        # 会导致“无版本变更”时 step 误报失败（v0.3.31 实测）。bash 的 || 语义正确。
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md
          # [skip ci]：避免 bump 提交推送回 master 时再次触发 Release（防循环）
          git commit -m "v${{ steps.bump.outputs.new }}: 自动版本迭代 [skip ci]" || echo "无版本变更提交"

      # 推送 bump 提交回 master：保证远端版本与已发布版本一致（避免下次重复 bump）
      # v0.4.13（审计修复 T5）：推送后显式创建并推送 tag，使其指向含对应
      # CHANGELOG 条目的提交（此前由 tauri-action 建在缺少该条目的检出提交上）。
      - name: 推送版本变更与 tag 回 master
        shell: bash
        run: |
          git push origin HEAD:master || echo "无变更可推送（远端已是最新）"
          NEW_TAG="v${{ steps.bump.outputs.new }}"
          if git tag "$NEW_TAG" HEAD 2>/dev/null; then
            git push origin "$NEW_TAG" || echo "tag 推送失败（远端已存在则忽略）"
          else
            echo "tag $NEW_TAG 已存在，跳过创建"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建安装包 + 创建 Release（tauri-action 自动装 NSIS，产物上传 Release）
      - name: 构建并发布
        if: ${{ !inputs.skip-release }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.bump.outputs.new }}
          releaseName: "v${{ steps.bump.outputs.new }}"
          # 覆盖构建版本（tauri-action 默认读 tauri.conf.json，此处与 bump 后保持一致）
          appVersion: ${{ steps.bump.outputs.new }}
          releaseBody: "由 CI 自动构建发布"
          releaseDraft: false
          prerelease: false

      # Release notes 补充为 CHANGELOG 条目（完整修改日志）
      - name: 补充 Release notes（CHANGELOG 修改日志）
        if: ${{ !inputs.skip-release }}
        shell: bash
        run: |
          new_version="${{ steps.bump.outputs.new }}"
          gh release edit "v$new_version" --notes-file "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 便携包（portable zip）：tauri bundler 不产 zip，这里把 release exe 压 zip 上传，
      # 与安装包（setup.exe）一并作为发布产物（安装包 + 便携包）。
      # 用 pwsh（默认 shell）：路径天然 Windows 格式，无 bash/路径转换问题
      - name: 打包并上传便携包
        if: ${{ !inputs.skip-release }}
        shell: pwsh
        run: |
          $new_version = "${{ steps.bump.outputs.new }}"
          $exe = "src-tauri/target/release/dsh-launcher.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到 release exe: $exe（tauri-action 未保留？）"
            exit 1
          }
          $zip_name = "dsh-launcher_${new_version}_x64_portable.zip"
          $tmpdir = Join-Path $env:RUNNER_TEMP "portable"
          if (Test-Path $tmpdir) { Remove-Item $tmpdir -Recurse -Force }
          New-Item -ItemType Directory -Path $tmpdir | Out-Null
          Copy-Item $exe (Join-Path $tmpdir "dsh-launcher.exe")
          $zip_path = Join-Path $env:RUNNER_TEMP $zip_name
          Compress-Archive -Path (Join-Path $tmpdir "dsh-launcher.exe") -DestinationPath $zip_path -Force
          # 上传到已由 tauri-action 创建的 Release
          gh release upload "v$new_version" $zip_path --clobber
          Write-Host "已上传便携包: $zip_name"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 校验和（SHA-256）：本项目**不做代码签名**（产品决策，见 README），
      # 故以发布产物校验和作为“来源可验证”的替代手段：用户可核对下载文件
      # 与 Release 中 SHA256SUMS.txt 是否一致。
      - name: 生成并上传校验和（SHA256SUMS.txt）
        if: ${{ !inputs.skip-release }}
        shell: pwsh
        run: |
          $new_version = "${{ steps.bump.outputs.new }}"
          $sums = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          # 收集本次发布的全部产物（安装包 + 便携包）。
          # 安装包由 tauri bundler 输出到 bundle/nsis/（已核实路径，非 dist-bundles/）。
          $nsis_dir = "src-tauri/target/release/bundle/nsis"
          $targets = @()
          if (Test-Path $nsis_dir) {
            $targets += Get-ChildItem -Path $nsis_dir -Filter "*_${new_version}_*-setup.exe" | ForEach-Object { $_.FullName }
          }
          $targets += (Join-Path $env:RUNNER_TEMP "dsh-launcher_${new_version}_x64_portable.zip")
          $lines = @()
          foreach ($t in $targets) {
            if (Test-Path $t) {
              $h = (Get-FileHash -Algorithm SHA256 -Path $t).Hash.ToLower()
              $lines += "$h  $([System.IO.Path]::GetFileName($t))"
              Write-Host "SHA256  $([System.IO.Path]::GetFileName($t))  $h"
            } else {
              Write-Warning "跳過不存在的产物: $t"
            }
          }
          if ($lines.Count -eq 0) {
            Write-Error "未找到任何可校验的发布产物，无法生成 SHA256SUMS.txt"
            exit 1
          }
          # 统一 LF 行尾，便于跨平台核对（sha256sum -c 可直接使用）
          ($lines -join "`n") + "`n" | Set-Content -Path $sums -Encoding utf8NoBOM -NoNewline
          gh release upload "v$new_version" $sums --clobber
          Write-Host "已上传校验和: SHA256SUMS.txt（$($lines.Count) 个产物）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
